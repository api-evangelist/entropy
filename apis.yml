name: Entropy
description: >-
  Entropy is a threshold-signature network for trustless, programmable key
  management and distributed key generation (DKG). Positioned as "the Autonomous
  Agent Network," Entropy lets users and agents produce cryptographic signatures
  without any single party ever holding the private key, using on-chain WASM
  "programs" that define the exact conditions under which a signature may be
  generated. Built as a Substrate-based blockchain with a network of Threshold
  Signature Scheme (TSS) servers running inside Trusted Execution Environments
  (TEEs), Entropy delivers secure crypto custody, programmable signing, and
  distributed key management for Web3 and autonomous-agent use cases. Backed by
  a16z and surfaced into the API Evangelist network via the venture-portfolio
  pipeline.
